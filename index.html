<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股市值百大跌幅雷達</title><style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#0b1221;color:#e5eaf4}*{box-sizing:border-box}body{margin:0;padding:30px 16px}.wrap{max-width:1120px;margin:auto}h1{font-size:28px;margin:0}p{color:#94a3b8}.title{display:flex;align-items:center;justify-content:space-between;gap:14px}.card{background:#172236;border:1px solid #293750;border-radius:15px;padding:19px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:24px 0}.big{font-size:30px;font-weight:750;margin:7px 0}.muted{color:#94a3b8;font-size:13px}.red{color:#4ade80}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input,select,button{padding:11px 14px;border-radius:9px;border:1px solid #34435c;background:#1a2a42;color:#f1f5f9;font-size:14px}button{cursor:pointer}button.active{background:#2563eb;border-color:#2563eb}input{min-width:190px;flex:1}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:13px 12px;border-bottom:1px solid #2b3850;text-align:right}th:nth-child(2),td:nth-child(2){text-align:left}th{font-size:13px;color:#aebdd3}tbody tr:hover{background:#22314b}.scroll{overflow-x:auto}.status{background:#152c3d;padding:14px;border-radius:10px;margin:12px 0;color:#cbd5e1}.error{background:#3c1c2b;color:#fecaca}.small{font-size:12px;line-height:1.75;color:#8997ae;margin-top:17px}@media(max-width:650px){.cards{gap:7px}.card{padding:12px}.big{font-size:21px}body{padding:17px 10px}h1{font-size:21px}}
</style></head><body><div class="wrap"><div class="title"><div><h1>台股市值百大跌幅雷達</h1><p>上市＋上櫃普通股｜依市值排名｜官方盤後收盤資料</p></div><button onclick="load()">↻ 更新</button></div><div class="cards"><div class="card"><div class="muted">市值前100</div><div class="big" id="all">—</div><div class="muted">檔</div></div><div class="card"><div class="muted">下跌達門檻</div><div class="big red" id="alert">—</div><div class="muted">檔股票</div></div><div class="card"><div class="muted">最大跌幅</div><div class="big red" id="max">—</div><div class="muted" id="maxname">—</div></div></div><div id="status" class="status">正在取得官方資料…</div><div class="controls"><button data-v="alert" class="active" onclick="mode='alert';draw()">跌幅警示</button><button data-v="all" onclick="mode='all';draw()">全部百大</button><button data-v="down" onclick="mode='down';draw()">所有下跌</button><select id="threshold" onchange="draw()"><option value="3">跌幅 3%</option><option value="5" selected>跌幅 5%</option><option value="7">跌幅 7%</option><option value="10">跌幅 10%</option></select><input id="search" placeholder="搜尋股票名稱或代號" oninput="draw()"><button onclick="csv()">匯出 CSV</button></div><div class="card scroll"><div class="muted" id="shown">載入中</div><table><thead><tr><th>市值排名</th><th>股票代號／名稱</th><th>市場</th><th>收盤價</th><th>漲跌幅</th><th>市值（億元）</th></tr></thead><tbody id="rows"><tr><td colspan="6" style="text-align:center">正在讀取</td></tr></tbody></table></div><div class="small">資料來源：TWSE 每日收盤行情 MI_INDEX、TWSE 上市公司發行股數資料、TPEx 上櫃股票收盤行情。市值＝收盤價 × 股數；單日漲跌幅＝漲跌價差 ÷ 前收盤價。本網站每次開啟時會查詢伺服器，每五分鐘定時更新；非盤中即時報價。資料異常會顯示錯誤，不以空名單表示無跌幅。此網站未使用付費金融行情授權。</div></div><script>
let data=[],mode='alert',date='';const $=id=>document.getElementById(id);
async function load(){ $('status').textContent='正在更新官方資料…';try{let r=await fetch('./data.json?ts='+Date.now());let st=null;try{st=await (await fetch('./status.json?ts='+Date.now())).json()}catch(e){}let d=await r.json();if(!r.ok||d.error)throw Error(d.error||'伺服器錯誤');data=d.stocks;date=d.date;$('status').className='status';$('status').textContent='✓ 最新完整共同收盤交易日：'+date+'｜涵蓋 '+d.total+' 檔上市及上櫃股票｜更新：'+d.updated+(st&&st.message?'｜'+st.message:'');draw()}catch(e){data=[];$('status').className='status error';$('status').textContent='資料取得失敗：'+e.message;draw()}}
function draw(){let t=Number($('threshold').value),q=$('search').value.trim();document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===mode));let a=data.filter(x=>x.pct<=-t),filtered=data.filter(x=>(mode==='all'||(mode==='down'?x.pct<0:x.pct<=-t))&&(x.code.includes(q)||x.name.includes(q)));$('all').textContent=data.length||'—';$('alert').textContent=data.length?a.length:'—';let worst=[...data].sort((a,b)=>a.pct-b.pct)[0];$('max').textContent=worst?worst.pct.toFixed(2)+'%':'—';$('maxname').textContent=worst?worst.code+' '+worst.name:'—';$('shown').textContent='符合條件 '+filtered.length+' 檔';$('rows').innerHTML=filtered.map(x=>'<tr><td>'+x.rank+'</td><td><b>'+x.code+'</b> '+x.name+'</td><td>'+x.market+'</td><td>'+x.price.toFixed(2)+'</td><td style="color:'+(x.pct<0?'#4ade80':'#fb7185')+'">'+(x.pct>0?'+':'')+x.pct.toFixed(2)+'%</td><td>'+(x.cap/1e8).toLocaleString('zh-TW',{maximumFractionDigits:1})+'</td></tr>').join('')||'<tr><td colspan="6" style="text-align:center;padding:35px">已驗證交易日沒有符合條件的股票；資料尚未取得則不代表沒有下跌</td></tr>'}
function csv(){if(!data.length)return;let rows=[['排名','代號','股票名稱','市場','收盤價','漲跌幅','市值元'],...data.map(x=>[x.rank,x.code,x.name,x.market,x.price,x.pct,x.cap])];let blob=new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tw100-'+date+'.csv';a.click();URL.revokeObjectURL(a.href)}
load();setInterval(load,300000);
</script></body></html>
