name: Update official stock closing data
on:
  workflow_dispatch:
  schedule:
    # UTC 06:00-09:45 = Asia/Taipei 14:00-17:45 on trading weekdays.
    # Check every 15 minutes; publish only same-date verified ranking.
    - cron: "0,15,30,45 6-9 * * 1-5"
permissions:
  contents: write
concurrency:
  group: tw-stocks-close
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python update_data.py
      - name: Commit fresh data and update status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TWSE/TPEx verified closing data"
            git pull --rebase origin main
            git push
          fi
